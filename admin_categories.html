<!DOCTYPE html>
<html lang="en">
<head>
    <!-- File: admin_categories.html  (converted from admin_categories.php) -->

    <title>Manage Categories - Restaurant Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ADMIN HEADER -->
<header class="site-header mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"
                    aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="admin_dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin_categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin_products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin_contacts.html">Contacts</a></li>
                </ul>
                <span class="navbar-text me-3" id="admin-username-display"></span>
                <a class="btn btn-outline-light btn-sm" href="admin_logout.html">Logout</a>
            </div>
        </div>
    </nav>
</header>

<main class="container mb-5">

    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Manage Categories</h1>
            <div id="alert-success" class="alert alert-success" style="display:none;"></div>
            <div id="alert-danger"  class="alert alert-danger"  style="display:none;"></div>
        </div>
    </div>

    <!-- LIST VIEW -->
    <div id="view-list">
        <div class="mb-3">
            <button class="btn btn-primary" id="btn-show-add">Add Category</button>
        </div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th style="width:120px;">Actions</th>
                </tr>
            </thead>
            <tbody id="category-table-body"></tbody>
        </table>
    </div>

    <!-- ADD FORM -->
    <div id="view-add" style="display:none;">
        <div class="card card-body">
            <div class="mb-3">
                <label for="add-name" class="form-label">Category Name*</label>
                <input type="text" id="add-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="add-description" class="form-label">Description</label>
                <textarea id="add-description" class="form-control" rows="3"></textarea>
            </div>
            <div>
                <button class="btn btn-primary" id="btn-add-submit">Add Category</button>
                <button class="btn btn-secondary ms-2" id="btn-add-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- EDIT FORM -->
    <div id="view-edit" style="display:none;">
        <div class="card card-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
                <label for="edit-name" class="form-label">Category Name*</label>
                <input type="text" id="edit-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="edit-description" class="form-label">Description</label>
                <textarea id="edit-description" class="form-control" rows="3"></textarea>
            </div>
            <div>
                <button class="btn btn-primary" id="btn-edit-submit">Save Changes</button>
                <button class="btn btn-secondary ms-2" id="btn-edit-cancel">Cancel</button>
            </div>
        </div>
    </div>

</main>

<!-- ADMIN FOOTER -->
<footer class="site-footer py-3 mt-auto bg-light">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store Admin Panel</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>

<script>
/* Auth guard */
if (sessionStorage.getItem('admin_logged_in') !== 'true') window.location.href = 'admin_login.html';
document.getElementById('admin-username-display').textContent =
    'Logged in as ' + (sessionStorage.getItem('admin_username') || 'Admin');
document.getElementById('footer-year').textContent = new Date().getFullYear();

/* ── localStorage helpers ──
   Categories loaded from categories.json initially, then edits are
   persisted to localStorage under key 'admin_categories'.
   On first load, categories.json is fetched and seeded into localStorage.
   This mirrors the MySQL table as the source-of-truth for admin edits.
*/
const LS_KEY = 'admin_categories';

async function seedIfNeeded() {
    if (localStorage.getItem(LS_KEY) !== null) return;
    const cats = await getAllCategories(); // reads categories.json
    localStorage.setItem(LS_KEY, JSON.stringify(cats));
}

function loadCats() {
    return JSON.parse(localStorage.getItem(LS_KEY) || '[]');
}
function saveCats(cats) {
    localStorage.setItem(LS_KEY, JSON.stringify(cats));
}
function nextId(cats) {
    return cats.length ? Math.max(...cats.map(c => c.id)) + 1 : 1;
}

/* ── UI helpers ── */
function showAlert(type, msg) {
    const el = document.getElementById(type === 'success' ? 'alert-success' : 'alert-danger');
    el.textContent = msg;
    el.style.display = '';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
}
function showView(name) {
    ['list','add','edit'].forEach(v => {
        document.getElementById('view-' + v).style.display = (v === name) ? '' : 'none';
    });
}

function renderTable() {
    const cats = loadCats().sort((a, b) => a.name.localeCompare(b.name));
    const tbody = document.getElementById('category-table-body');
    tbody.innerHTML = '';
    cats.forEach(cat => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${esc(cat.name)}</td>
            <td>${esc(cat.description || '').replace(/\n/g, '<br>')}</td>
            <td>
                <button class="btn btn-sm btn-secondary me-1" data-edit="${cat.id}">Edit</button>
                <button class="btn btn-sm btn-danger delete-link" data-delete="${cat.id}">Delete</button>
            </td>`;
        tbody.appendChild(tr);
    });

    /* Edit buttons */
    tbody.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openEdit(parseInt(btn.dataset.edit)));
    });
    /* Delete buttons */
    tbody.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
            if (!confirm('Are you sure you want to delete this item?')) return;
            let cats = loadCats();
            cats = cats.filter(c => c.id !== parseInt(btn.dataset.delete));
            saveCats(cats);
            renderTable();
            showAlert('success', 'Category deleted');
        });
    });
}

function openEdit(id) {
    const cat = loadCats().find(c => c.id === id);
    if (!cat) return;
    document.getElementById('edit-id').value          = cat.id;
    document.getElementById('edit-name').value        = cat.name;
    document.getElementById('edit-description').value = cat.description || '';
    showView('edit');
}

/* ── Event wiring ── */
document.getElementById('btn-show-add').addEventListener('click', () => {
    document.getElementById('add-name').value        = '';
    document.getElementById('add-description').value = '';
    showView('add');
});
document.getElementById('btn-add-cancel').addEventListener('click',  () => showView('list'));
document.getElementById('btn-edit-cancel').addEventListener('click', () => showView('list'));

document.getElementById('btn-add-submit').addEventListener('click', () => {
    const name = document.getElementById('add-name').value.trim();
    const desc = document.getElementById('add-description').value.trim();
    if (!name) { showAlert('danger', 'Name is required.'); return; }
    const cats = loadCats();
    cats.push({ id: nextId(cats), name, description: desc });
    saveCats(cats);
    renderTable();
    showAlert('success', 'Category added');
    showView('list');
});

document.getElementById('btn-edit-submit').addEventListener('click', () => {
    const id   = parseInt(document.getElementById('edit-id').value);
    const name = document.getElementById('edit-name').value.trim();
    const desc = document.getElementById('edit-description').value.trim();
    if (!name) { showAlert('danger', 'Name is required.'); return; }
    const cats = loadCats().map(c => c.id === id ? { ...c, name, description: desc } : c);
    saveCats(cats);
    renderTable();
    showAlert('success', 'Category updated');
    showView('list');
});

/* ── Boot ── */
(async function init() {
    await loadAndApplySiteSettings();
    await seedIfNeeded();
    renderTable();
    showView('list');
})();
</script>
</body>
</html>
