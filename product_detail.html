<!DOCTYPE html>
<html lang="en">
<head>
    <!-- File: product_detail.html  (converted from product_detail.php + includes/header.php) -->
    <meta charset="UTF-8">
    <title>Product Details - Restaurant Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER / NAV -->
<header class="site-header mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">🍽 Restaurant Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">🛒 Cart <span class="badge bg-danger" id="cart-count" style="display:none;"></span></a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container mb-5">
    <div id="product-content">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer py-3 mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store. All rights reserved.</p>
        <p class="mb-0"><a href="admin_login.html">Admin Login</a></p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>

<script>
document.getElementById('footer-year').textContent = new Date().getFullYear();

let currentProduct = null;
let selectedQty = 1;

(async function init() {
    await loadAndApplySiteSettings();

    const params = getQueryParams();
    const id = params['id'] ? parseInt(params['id']) : 0;
    const content = document.getElementById('product-content');

    if (id <= 0) {
        content.innerHTML = '<div class="alert alert-danger">Invalid product.</div>';
        return;
    }

    const product = await getProductById(id);

    if (!product) {
        content.innerHTML = '<div class="alert alert-danger">Product not found.</div>';
        return;
    }

    currentProduct = product;

    /* Mirrors the PHP product_detail.php HTML exactly */
    const imgHtml = product.image_name
        ? `<img src="images/${esc(product.image_name)}" class="img-fluid mb-3" alt="${esc(product.name)}">`
        : `<div class="border bg-light text-center py-5 mb-3"><span class="text-muted">No image available</span></div>`;

    const catHtml = product.category_name
        ? `<p><strong>Category:</strong> ${esc(product.category_name)}</p>`
        : '';

    const desc = (product.description || '').replace(/\n/g, '<br>');

    content.innerHTML = `
        <div class="row">
            <div class="col-md-6">${imgHtml}</div>
            <div class="col-md-6">
                <h1>${esc(product.name)}</h1>
                ${catHtml}
                <p><strong>Price:</strong> $${parseFloat(product.price).toFixed(2)}</p>
                <p>${desc}</p>
                <div class="mt-4">
                    <label for="qty" class="form-label"><strong>Quantity:</strong></label>
                    <div class="input-group mb-3" style="max-width: 150px;">
                        <button class="btn btn-outline-secondary" type="button" id="qty-minus">−</button>
                        <input type="number" id="qty" class="form-control text-center" value="1" min="1" max="99">
                        <button class="btn btn-outline-secondary" type="button" id="qty-plus">+</button>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-success" onclick="addToCart()">Add to Cart</button>
                    <a href="index.html" class="btn btn-secondary">Back to Menu</a>
                </div>
            </div>
        </div>`;
    
    // Setup quantity controls
    const qtyInput = document.getElementById('qty');
    document.getElementById('qty-minus').addEventListener('click', () => {
        const val = parseInt(qtyInput.value) || 1;
        if (val > 1) qtyInput.value = val - 1;
    });
    document.getElementById('qty-plus').addEventListener('click', () => {
        const val = parseInt(qtyInput.value) || 1;
        if (val < 99) qtyInput.value = val + 1;
    });
    qtyInput.addEventListener('change', () => {
        let val = parseInt(qtyInput.value) || 1;
        if (val < 1) val = 1;
        if (val > 99) val = 99;
        qtyInput.value = val;
        selectedQty = val;
    });
})();

function addToCart() {
    if (!currentProduct) return;
    const qty = parseInt(document.getElementById('qty').value) || 1;
    for (let i = 0; i < qty; i++) {
        Cart.add(currentProduct);
    }
    updateCartCount();
    alert(currentProduct.name + ' x' + qty + ' has been added to your cart!');
}

function updateCartCount() {
    const count = Cart.count();
    const badge = document.getElementById('cart-count');
    if (count > 0) {
        badge.textContent = count;
        badge.style.display = '';
    } else {
        badge.style.display = 'none';
    }
}

// Initialize cart count
setTimeout(updateCartCount, 100);
window.addEventListener('cart-updated', updateCartCount);
</script>
</body>
</html>
