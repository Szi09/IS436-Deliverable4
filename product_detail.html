<!DOCTYPE html>
<html lang="en">
<head>
    <!-- File: product_detail.html  (converted from product_detail.php + includes/header.php) -->
    <meta charset="UTF-8">
    <title>Product Details - Restaurant Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER / NAV -->
<header class="site-header mb-4">
    <nav class="navbar navbar-expand-lg navbar-light container">
        <a class="navbar-brand fw-bold" href="index.html">Restaurant Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item dropdown" id="nav-category-item" style="display:none;">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarCategoryDropdown"
                       role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Menu Categories
                    </a>
                    <ul class="dropdown-menu" id="nav-category-menu" aria-labelledby="navbarCategoryDropdown"></ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>
            <form class="d-flex" id="search-form">
                <input class="form-control me-2" type="search" id="search-input"
                       name="q" placeholder="Search dishes..." aria-label="Search">
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
        </div>
    </nav>
</header>

<main class="container mb-5">
    <div id="product-content">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer py-3 mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store. All rights reserved.</p>
        <p class="mb-0"><a href="admin_login.html">Admin Login</a></p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>

<script>
document.getElementById('footer-year').textContent = new Date().getFullYear();

document.getElementById('search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const q = document.getElementById('search-input').value.trim();
    window.location.href = 'index.html' + (q ? '?q=' + encodeURIComponent(q) : '');
});

function renderCategoryNav(categories) {
    if (!categories.length) return;
    const item = document.getElementById('nav-category-item');
    const menu = document.getElementById('nav-category-menu');
    item.style.display = '';
    categories.forEach(cat => {
        const li = document.createElement('li');
        li.innerHTML = `<a class="dropdown-item" href="index.html?category_id=${encodeURIComponent(cat.id)}">${esc(cat.name)}</a>`;
        menu.appendChild(li);
    });
}

(async function init() {
    await loadAndApplySiteSettings();
    const categories = await getAllCategories();
    renderCategoryNav(categories);

    const params = getQueryParams();
    const id = params['id'] ? parseInt(params['id']) : 0;
    const content = document.getElementById('product-content');

    if (id <= 0) {
        content.innerHTML = '<div class="alert alert-danger">Invalid product.</div>';
        return;
    }

    const product = await getProductById(id);

    if (!product) {
        content.innerHTML = '<div class="alert alert-danger">Product not found.</div>';
        return;
    }

    /* Mirrors the PHP product_detail.php HTML exactly */
    const imgHtml = product.image_name
        ? `<img src="images/${esc(product.image_name)}" class="img-fluid mb-3" alt="${esc(product.name)}">`
        : `<div class="border bg-light text-center py-5 mb-3"><span class="text-muted">No image available</span></div>`;

    const catHtml = product.category_name
        ? `<p><strong>Category:</strong> ${esc(product.category_name)}</p>`
        : '';

    const desc = (product.description || '').replace(/\n/g, '<br>');

    content.innerHTML = `
        <div class="row">
            <div class="col-md-6">${imgHtml}</div>
            <div class="col-md-6">
                <h1>${esc(product.name)}</h1>
                ${catHtml}
                <p><strong>Price:</strong> $${parseFloat(product.price).toFixed(2)}</p>
                <p>${desc}</p>
                <a href="index.html" class="btn btn-secondary">Back to Menu</a>
            </div>
        </div>`;
})();
</script>
</body>
</html>
