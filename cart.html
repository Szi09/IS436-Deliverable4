<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart - Restaurant Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER / NAV -->
<header class="site-header mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">🍽 Restaurant Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cart.html">🛒 Cart <span class="badge bg-danger" id="cart-count" style="display:none;"></span></a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container mb-5">
    <h1 class="mb-4">Shopping Cart</h1>

    <div class="row">
        <div class="col-md-8">
            <div id="cart-items">
                <div class="text-center py-5">
                    <p class="text-muted">Your cart is empty. <a href="index.html">Continue shopping</a></p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Order Summary</h5>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax (8%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3" style="font-size: 1.1rem; font-weight: bold;">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <a href="checkout.html" id="checkout-btn" class="btn btn-primary w-100 mb-2" style="pointer-events: none; opacity: 0.5;">Proceed to Checkout</a>
                    <a href="index.html" class="btn btn-outline-secondary w-100">Continue Shopping</a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer py-3 mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>

<script>
document.getElementById('footer-year').textContent = new Date().getFullYear();

function renderCart() {
    const items = Cart.get();
    const cartDiv = document.getElementById('cart-items');
    
    if (items.length === 0) {
        cartDiv.innerHTML = `
            <div class="text-center py-5">
                <div class="mb-3">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="m1 1 4 4h15l-1 5H6"></path>
                    </svg>
                </div>
                <h4 class="text-muted mb-3">Your cart is empty</h4>
                <p class="text-muted mb-4">Add some delicious items from our menu to get started!</p>
                <a href="index.html" class="btn btn-primary">Browse Menu</a>
            </div>
        `;
        updateTotals();
        return;
    }

    let html = '<div class="table-responsive"><table class="table">';
    html += '<thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody>';
    
    items.forEach(item => {
        const subtotal = (parseFloat(item.price) * item.qty).toFixed(2);
        html += `
            <tr>
                <td>${esc(item.name)}</td>
                <td>$${parseFloat(item.price).toFixed(2)}</td>
                <td>
                    <input type="number" min="1" value="${item.qty}" style="width: 60px;" 
                           onchange="updateQty(${item.id}, this.value)">
                </td>
                <td>$${subtotal}</td>
                <td><button class="btn btn-sm btn-danger" onclick="removeItem(${item.id})">Remove</button></td>
            </tr>
        `;
    });
    
    html += '</tbody></table></div>';
    cartDiv.innerHTML = html;
    updateTotals();
}

function updateQty(id, qty) {
    const qtyNum = parseInt(qty);
    if (qtyNum <= 0) {
        removeItem(id);
    } else {
        Cart.updateQty(id, qtyNum);
        renderCart();
    }
}

function removeItem(id) {
    Cart.remove(id);
    renderCart();
}

function updateTotals() {
    const items = Cart.get();
    const subtotal = items.reduce((sum, i) => sum + parseFloat(i.price) * i.qty, 0);
    const tax = subtotal * 0.08;
    const total = subtotal + tax;
    
    document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
    document.getElementById('tax').textContent = '$' + tax.toFixed(2);
    document.getElementById('total').textContent = '$' + total.toFixed(2);
}

function updateCartCount() {
    const count = Cart.count();
    const badge = document.getElementById('cart-count');
    const checkoutBtn = document.getElementById('checkout-btn');
    
    if (count > 0) {
        badge.textContent = count;
        badge.style.display = '';
        checkoutBtn.style.pointerEvents = '';
        checkoutBtn.style.opacity = '1';
    } else {
        badge.style.display = 'none';
        checkoutBtn.style.pointerEvents = 'none';
        checkoutBtn.style.opacity = '0.5';
    }
}

// Initialize
(async function init() {
    renderCart();
    updateCartCount();
    
    // Listen for cart updates
    window.addEventListener('cart-updated', () => {
        renderCart();
        updateCartCount();
    });
})();

setTimeout(updateCartCount, 100);
</script>

</body>
</html>
