<!DOCTYPE html>
<html lang="en">
<head>
    <!-- File: admin_login.html  (converted from admin_login.php) -->
    <meta charset="UTF-8">
    <title>Admin Login - Restaurant Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h1 class="h3 mb-3 text-center">Admin Login</h1>

            <div id="alert-error" class="alert alert-danger" style="display:none;"></div>

            <!--
                Login form.
                Previously validated against t_IS448_F25_admins via PDO + password_verify().

                Static replacement: credentials are stored in admin_credentials.json.
                The password is stored as a plain string (no bcrypt in the browser).
                Keep admin_credentials.json OUT of your public Docker web root —
                serve it only from a protected location, or hard-code credentials
                directly in this script below.

                admin_credentials.json shape:
                [{ "username": "admin", "password": "admin123" }]
            -->
            <form class="card card-body" id="login-form" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center mt-3">
                <a href="index.html">Back to public site</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* If already logged in, redirect straight to dashboard */
if (sessionStorage.getItem('admin_logged_in') === 'true') {
    window.location.href = 'admin_dashboard.html';
}

function showError(msg) {
    const el = document.getElementById('alert-error');
    el.textContent = msg;
    el.style.display = '';
}

document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
        showError('Username and password are required.');
        return;
    }

    /* Try to load credentials from admin_credentials.json */
    let admins = [];
    try {
        const res = await fetch('admin_credentials.json');
        if (res.ok) admins = await res.json();
    } catch (_) { /* file missing — fall through to default below */ }

    /* Fallback default (matches db_init.php defaults) */
    if (!admins.length) {
        admins = [{ username: 'admin', password: 'admin123' }];
    }

    const match = admins.find(a => a.username === username && a.password === password);
    if (match) {
        sessionStorage.setItem('admin_logged_in', 'true');
        sessionStorage.setItem('admin_username', username);
        window.location.href = 'admin_dashboard.html';
    } else {
        showError('Invalid username or password.');
    }
});
</script>
</body>
</html>
