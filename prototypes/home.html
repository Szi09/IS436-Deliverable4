<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: Home</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background:#f5f5f5; }
    header { background:#0d6efd; color:#fff; padding:1rem; }
    .container { padding: 1.5rem; }
    .card { background:#fff; border-radius: 8px; padding:1rem; margin-bottom:1rem; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    .nav { margin-bottom:1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Restaurant Store Prototype</h1>
    <p>Home Screen</p>
  </header>
  <div class="container">
    <div class="nav card">
      <strong>Navigation:</strong> Home | Menu | Cart | Contact | Admin Login
    </div>
    <div class="card">
      <h2>Featured Menu</h2>
      <p>Customers can quickly browse products, see special offers, and access the menu drop-down.</p>
    </div>
    <div class="card">
      <h2>Search and Category</h2>
      <p>Search field plus menu category selection available from the navbar.</p>
    </div>
  </div>
</body>
</html>
