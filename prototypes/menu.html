<html lang="en">
<head>

  <title>Prototype: Menu</title>
  <style>

    </div>
    <div class="grid">
      <div class="card"><h3>Menu item card</h3><p>Name, description, price, Add to Cart</p></div>
      <div class="card"><h3>Menu item card</h3><p>Name, description, price, Add to Cart</p></div>
      <div class="card"><h3>Menu item card</h3><p>Name, description, price, Add to Cart</p></div>

</html>
