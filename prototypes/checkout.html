<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: Checkout</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
    header { background:#198754; color:#fff; padding:1rem; }
    .container { padding:1.5rem; }
    .card { background:#fff; border-radius:8px; padding:1rem; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:1rem; }
    label { display:block; margin:0.5rem 0 0.25rem; }
    input, select, textarea { width:100%; padding:0.7rem; border:1px solid #ccc; border-radius: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>Checkout Prototype</h1>
  </header>
  <div class="container">
    <div class="card">
      <h2>Customer Information</h2>
      <p>Form fields for name, email, phone, address, delivery method, payment method, and notes.</p>
    </div>
    <div class="card">
      <h2>Order Summary</h2>
      <p>Displays items, subtotal, tax, delivery fee, and total with checkout button.</p>
    </div>
  </div>
</body>
</html>
