<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: Cart</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
    header { background:#0d6efd; color:#fff; padding:1rem; }
    .container { padding:1.5rem; }
    .card { background:#fff; border-radius:8px; padding:1rem; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:.75rem; text-align:left; border-bottom:1px solid #e9ecef; }
  </style>
</head>
<body>
  <header>
    <h1>Cart Prototype</h1>
  </header>
  <div class="container">
    <div class="card">
      <h2>Cart contents</h2>
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
        <tbody>
          <tr><td>Item 1</td><td>2</td><td>$10.00</td><td>$20.00</td></tr>
          <tr><td>Item 2</td><td>1</td><td>$12.00</td><td>$12.00</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>Summary</h2>
      <p>Subtotal, tax, total, and checkout button.</p>
    </div>
  </div>
</body>
</html>
