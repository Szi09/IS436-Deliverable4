            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="admin_dashboard.html">Dashboard</a></li>

</header>

<main class="container mb-5">

    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Admin Dashboard</h1>
        </div>
    </div>

    <!-- Count cards — mirrors the three $pdo->query("SELECT COUNT(*)…") calls -->
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Categories</h5>
                    <p class="card-text display-6" id="count-categories">…</p>
                    <a href="admin_categories.html" class="btn btn-light btn-sm">Manage Categories</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-success">
                <div class="card-body">

        <div class="col-md-4">

                    <p class="card-text display-6" id="count-contacts">…</p>

</main>

<!-- ADMIN FOOTER (converted from includes/admin_footer.php) -->
<footer class="site-footer py-3 mt-auto bg-light">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store Admin Panel</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>

<script>
/* Auth guard — mirrors require_once includes/auth.php */
if (sessionStorage.getItem('admin_logged_in') !== 'true') {
    window.location.href = 'admin_login.html';
}
document.getElementById('admin-username-display').textContent =
    'Logged in as ' + (sessionStorage.getItem('admin_username') || 'Admin');
document.getElementById('footer-year').textContent = new Date().getFullYear();

(async function init() {
    await loadAndApplySiteSettings();

    const [categories, products] = await Promise.all([
        getAllCategories(),
        getProducts()
    ]);

    /* Contact messages stored in localStorage by contact.html */
    const messages = JSON.parse(localStorage.getItem('contact_messages') || '[]');

    document.getElementById('count-categories').textContent = categories.length;
    document.getElementById('count-products').textContent   = products.length;
    document.getElementById('count-contacts').textContent   = messages.length;
})();
</script>
</body>
