    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ADMIN HEADER -->
<header class="site-header mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"
                    aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="admin_dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin_categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin_products.html">Products</a></li>

                </ul>

            </div>
        </div>
    </nav>
</header>

<main class="container mb-5">

    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Manage Products</h1>
            <div id="alert-success" class="alert alert-success" style="display:none;"></div>
            <div id="alert-danger"  class="alert alert-danger"  style="display:none;"></div>
        </div>
    </div>

    <!-- LIST VIEW -->
    <div id="view-list">
        <div class="mb-3">
            <button class="btn btn-primary" id="btn-show-add">Add Product</button>
        </div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Image Name</th>
                    <th style="width:140px;">Actions</th>
                </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
        </table>
    </div>

    <!-- ADD FORM -->
    <div id="view-add" style="display:none;">
        <div class="card card-body">
            <div class="mb-3">
                <label for="add-name" class="form-label">Product Name*</label>
                <input type="text" id="add-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="add-category-id" class="form-label">Category*</label>
                <select id="add-category-id" class="form-select" required>
                    <option value="">-- Select Category --</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="add-price" class="form-label">Price (e.g. 9.99)*</label>
                <input type="number" step="0.01" min="0" id="add-price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="add-image-name" class="form-label">Image File Name (e.g. pizza.jpg)</label>
                <input type="text" id="add-image-name" class="form-control">
                <div class="form-text">Place the image in the <code>images</code> folder of this project.</div>
            </div>
            <div class="mb-3">
                <label for="add-description" class="form-label">Description</label>
                <textarea id="add-description" class="form-control" rows="4"></textarea>
            </div>
            <div>
                <button class="btn btn-primary" id="btn-add-submit">Add Product</button>
                <button class="btn btn-secondary ms-2" id="btn-add-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- EDIT FORM -->
    <div id="view-edit" style="display:none;">
        <div class="card card-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
                <label for="edit-name" class="form-label">Product Name*</label>
                <input type="text" id="edit-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="edit-category-id" class="form-label">Category*</label>
                <select id="edit-category-id" class="form-select" required>
                    <option value="">-- Select Category --</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="edit-price" class="form-label">Price (e.g. 9.99)*</label>
                <input type="number" step="0.01" min="0" id="edit-price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="edit-image-name" class="form-label">Image File Name (e.g. pizza.jpg)</label>
                <input type="text" id="edit-image-name" class="form-control">
                <div class="form-text">Place the image in the <code>images</code> folder of this project.</div>
            </div>
            <div class="mb-3">
                <label for="edit-description" class="form-label">Description</label>
                <textarea id="edit-description" class="form-control" rows="4"></textarea>
            </div>
            <div>
                <button class="btn btn-primary" id="btn-edit-submit">Save Changes</button>
                <button class="btn btn-secondary ms-2" id="btn-edit-cancel">Cancel</button>
            </div>
        </div>
    </div>

</main>

<!-- ADMIN FOOTER -->
<footer class="site-footer py-3 mt-auto bg-light">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store Admin Panel</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>

<script>
/* Auth guard */
if (sessionStorage.getItem('admin_logged_in') !== 'true') window.location.href = 'admin_login.html';
document.getElementById('admin-username-display').textContent =
    'Logged in as ' + (sessionStorage.getItem('admin_username') || 'Admin');
document.getElementById('footer-year').textContent = new Date().getFullYear();

const LS_PROD = 'admin_products';
const LS_CATS = 'admin_categories';

async function seedIfNeeded() {
    if (localStorage.getItem(LS_PROD) === null) {
        const prods = await getProducts();
        localStorage.setItem(LS_PROD, JSON.stringify(prods));
    }
    if (localStorage.getItem(LS_CATS) === null) {
        const cats = await getAllCategories();
        localStorage.setItem(LS_CATS, JSON.stringify(cats));
    }
}

function loadProds() { return JSON.parse(localStorage.getItem(LS_PROD) || '[]'); }
function saveProds(p) { localStorage.setItem(LS_PROD, JSON.stringify(p)); }
function loadCats()  { return JSON.parse(localStorage.getItem(LS_CATS)  || '[]'); }
function nextId(arr) { return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1; }

function showAlert(type, msg) {
    const el = document.getElementById(type === 'success' ? 'alert-success' : 'alert-danger');
    el.textContent = msg;
    el.style.display = '';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
}
function showView(name) {
    ['list','add','edit'].forEach(v => {
        document.getElementById('view-' + v).style.display = (v === name) ? '' : 'none';
    });
}

function populateCategorySelect(selectId, selectedCatId) {
    const cats = loadCats().sort((a, b) => a.name.localeCompare(b.name));
    const sel  = document.getElementById(selectId);
    // remove dynamic options
    while (sel.options.length > 1) sel.remove(1);
    cats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = cat.name;
        if (cat.id === selectedCatId) opt.selected = true;
        sel.appendChild(opt);
    });
}

function categoryName(catId) {
    return (loadCats().find(c => c.id === catId) || {}).name || '';
}

function renderTable() {
    const prods = loadProds().sort((a, b) => a.name.localeCompare(b.name));
    const tbody = document.getElementById('product-table-body');
    tbody.innerHTML = '';
    prods.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${esc(p.name)}</td>
            <td>${esc(categoryName(p.category_id))}</td>
            <td>$${parseFloat(p.price).toFixed(2)}</td>
            <td>${esc(p.image_name || '')}</td>
            <td>
                <button class="btn btn-sm btn-secondary me-1" data-edit="${p.id}">Edit</button>
                <button class="btn btn-sm btn-danger delete-link" data-delete="${p.id}">Delete</button>
            </td>`;
        tbody.appendChild(tr);
    });

    tbody.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openEdit(parseInt(btn.dataset.edit)));
    });
    tbody.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
            if (!confirm('Are you sure you want to delete this item?')) return;
            saveProds(loadProds().filter(p => p.id !== parseInt(btn.dataset.delete)));
            renderTable();
            showAlert('success', 'Product deleted');
        });
    });
}

function openEdit(id) {
    const p = loadProds().find(x => x.id === id);
    if (!p) return;
    document.getElementById('edit-id').value          = p.id;
    document.getElementById('edit-name').value        = p.name;
    document.getElementById('edit-price').value       = p.price;
    document.getElementById('edit-image-name').value  = p.image_name || '';
    document.getElementById('edit-description').value = p.description || '';
    populateCategorySelect('edit-category-id', p.category_id);
    showView('edit');
}

document.getElementById('btn-show-add').addEventListener('click', () => {
    document.getElementById('add-name').value        = '';
    document.getElementById('add-price').value       = '';
    document.getElementById('add-image-name').value  = '';
    document.getElementById('add-description').value = '';
    populateCategorySelect('add-category-id', null);
    showView('add');
});
document.getElementById('btn-add-cancel').addEventListener('click',  () => showView('list'));
document.getElementById('btn-edit-cancel').addEventListener('click', () => showView('list'));

document.getElementById('btn-add-submit').addEventListener('click', () => {
    const name       = document.getElementById('add-name').value.trim();
    const price      = parseFloat(document.getElementById('add-price').value);
    const categoryId = parseInt(document.getElementById('add-category-id').value);
    const imageName  = document.getElementById('add-image-name').value.trim();
    const description= document.getElementById('add-description').value.trim();

    if (!name || isNaN(price) || price <= 0 || isNaN(categoryId) || categoryId <= 0) {
        showAlert('danger', 'Name, positive price, and category are required.');
        return;
    }
    const prods = loadProds();
    prods.push({ id: nextId(prods), name, description, price, category_id: categoryId, image_name: imageName, category_name: categoryName(categoryId) });
    saveProds(prods);
    renderTable();
    showAlert('success', 'Product added');
    showView('list');
});

document.getElementById('btn-edit-submit').addEventListener('click', () => {
    const id         = parseInt(document.getElementById('edit-id').value);
    const name       = document.getElementById('edit-name').value.trim();
    const price      = parseFloat(document.getElementById('edit-price').value);
    const categoryId = parseInt(document.getElementById('edit-category-id').value);
    const imageName  = document.getElementById('edit-image-name').value.trim();
    const description= document.getElementById('edit-description').value.trim();

    if (!name || isNaN(price) || price <= 0 || isNaN(categoryId) || categoryId <= 0) {
        showAlert('danger', 'Valid product, name, price, and category are required.');
        return;
    }
    const prods = loadProds().map(p => p.id === id
        ? { ...p, name, description, price, category_id: categoryId, image_name: imageName, category_name: categoryName(categoryId) }
        : p);
    saveProds(prods);
    renderTable();
    showAlert('success', 'Product updated');
    showView('list');
});

(async function init() {
    await loadAndApplySiteSettings();
    await seedIfNeeded();
    renderTable();
    showView('list');
})();
</script>
</body>
</html>
