<!DOCTYPE html>
<html lang="en">
<head>
    <!-- File: admin_contacts.html  (converted from admin_contacts.php) -->
    <meta charset="UTF-8">
    <title>Contact Messages - Restaurant Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ADMIN HEADER -->
<header class="site-header mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"
                    aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="admin_dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin_categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin_products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin_contacts.html">Contacts</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin_settings.html">Site Colors</a></li>
                </ul>
                <span class="navbar-text me-3" id="admin-username-display"></span>
                <a class="btn btn-outline-light btn-sm" href="admin_logout.html">Logout</a>
            </div>
        </div>
    </nav>
</header>

<main class="container mb-5">

    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Contact Messages</h1>
        </div>
    </div>

    <div id="messages-container">
        <!-- Populated by JS -->
    </div>

</main>

<!-- ADMIN FOOTER -->
<footer class="site-footer py-3 mt-auto bg-light">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="footer-year"></span> Restaurant Store Admin Panel</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>

<script>
/* Auth guard */
if (sessionStorage.getItem('admin_logged_in') !== 'true') window.location.href = 'admin_login.html';
document.getElementById('admin-username-display').textContent =
    'Logged in as ' + (sessionStorage.getItem('admin_username') || 'Admin');
document.getElementById('footer-year').textContent = new Date().getFullYear();

(async function init() {
    await loadAndApplySiteSettings();

    /* Contact messages are saved by contact.html into localStorage */
    const messages = JSON.parse(localStorage.getItem('contact_messages') || '[]');
    const container = document.getElementById('messages-container');

    if (!messages.length) {
        container.innerHTML = '<div class="alert alert-info">No messages yet.</div>';
        return;
    }

    /* Mirrors the PHP table exactly */
    let rows = '';
    messages.forEach(m => {
        const desc = (m.message || '').replace(/\n/g, '<br>');
        rows += `
            <tr>
                <td>${esc(m.created_at)}</td>
                <td>${esc(m.name)}</td>
                <td>${esc(m.email)}</td>
                <td>${desc}</td>
            </tr>`;
    });

    container.innerHTML = `
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
})();
</script>
</body>
</html>
